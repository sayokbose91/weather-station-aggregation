name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore WeatherStation.slnx
      - run: dotnet build WeatherStation.slnx --no-restore -c Release
      - run: dotnet test WeatherStation.slnx --no-build -c Release --collect:"XPlat Code Coverage"

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/WeatherStation.Api/Dockerfile -t weather-station-api .
